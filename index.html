<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081324" />
    <title>Run Nova Scotia | Promoting Road Running in Nova Scotia</title>
    <meta name="description" content="The mission of Run Nova Scotia is to promote health, fitness, and camaraderie to all ages and abilities through the sport of road running! Powered by modern Zunzo athletic design." />

    <!-- Google Fonts: Oswald (Headings) and Jost (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Inline Critical CSS for instantaneous paint on slow / throttled connections -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #040b17;
        color: #f8fafc;
      }
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0a1c38 0%, #040b17 100%);
        z-index: 9999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .preloader-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }
      .preloader-logo {
        width: 52px;
        height: 52px;
        object-fit: contain;
        animation: rns-pulse 1.8s ease-in-out infinite;
      }
      .preloader-title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: #ffffff;
        font-style: italic;
      }
      .preloader-title span {
        color: #fef000;
      }
      .preloader-bar-bg {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #0080ff, #fef000);
        border-radius: 9999px;
        animation: rns-slide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .preloader-subtext {
        margin-top: 14px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #94a3b8;
      }
      @keyframes rns-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes rns-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(254, 240, 0, 0.25)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 22px rgba(254, 240, 0, 0.6)); }
      }
    </style>
  </head>
  <body class="bg-[#000000] text-slate-100 font-sans selection:bg-volt selection:text-black antialiased overflow-x-hidden">
    <div id="root">
      <!-- Pure HTML & CSS preloader rendered instantly before any JavaScript or external CSS downloads -->
      <div id="preloader">
        <div class="preloader-brand">
          <img src="./favicon.png" alt="Run Nova Scotia" class="preloader-logo" />
          <div class="preloader-title">RUN <span>NOVA SCOTIA</span></div>
        </div>
        <div class="preloader-bar-bg">
          <div class="preloader-bar-fill"></div>
        </div>
        <div class="preloader-subtext">2026 Road Race Series</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
