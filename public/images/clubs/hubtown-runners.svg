<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Badge / Shield -->
  <rect width="200" height="200" rx="40" fill="#1E1B4B"/>
  <rect x="6" y="6" width="188" height="188" rx="34" stroke="#8B5CF6" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="100" cy="100" r="76" stroke="#CCFF00" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.6"/>

  <!-- Center Emblem Monogram -->
  <circle cx="100" cy="85" r="42" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="2"/>
  <text x="100" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#CCFF00" text-anchor="middle" letter-spacing="2">HTR</text>

  <!-- Title & Subtitle Banner -->
  <text x="100" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.5">HUBTOWN</text>
  <text x="100" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#CCFF00" text-anchor="middle" letter-spacing="2">TRURO RUNNERS</text>
</svg>